[build]
  command = "node scripts/build.mjs"
  publish = "."
  functions = "netlify/functions"

[functions]
  included_files = ["public_brain.md"]

# Sensitive server implementation and local tooling must not be served as static files.
[[redirects]]
  from = "/netlify/*"
  to = "/index.html"
  status = 404
  force = true
[[redirects]]
  from = "/node_modules/*"
  to = "/index.html"
  status = 404
  force = true
[[redirects]]
  from = "/tests/*"
  to = "/index.html"
  status = 404
  force = true
[[redirects]]
  from = "/scripts/*"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/.analytics-local/*"
  to = "/index.html"
  status = 404
  force = true
